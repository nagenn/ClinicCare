services:
  doctors-service:
    build: ./services/doctors
    ports:
      - "8002:8002"

  patient-service:
    build: ./services/patient
    ports:
      - "8001:8001"

  notification-service:
    build: ./services/notification
    ports:
      - "8005:8005"

  referral-service:
    build: ./services/referral
    ports:
      - "8003:8003"
    environment:
      DOCTORS_SERVICE_URL: http://doctors-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    depends_on:
      - doctors-service
      - notification-service

  document-service:
    build: ./services/document
    ports:
      - "8004:8004"

  lab-service:
    build: ./services/lab
    ports:
      - "8006:8006"
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8001
      DOCTORS_SERVICE_URL: http://doctors-service:8002
      REFERRAL_SERVICE_URL: http://referral-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
    depends_on:
      - patient-service
      - referral-service
      - notification-service

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8001
      DOCTORS_SERVICE_URL: http://doctors-service:8002
      REFERRAL_SERVICE_URL: http://referral-service:8003
      DOCUMENT_SERVICE_URL: http://document-service:8004
      NOTIFICATION_SERVICE_URL: http://notification-service:8005
      LAB_SERVICE_URL: http://lab-service:8006
    depends_on:
      - patient-service
      - doctors-service
      - referral-service
      - document-service
      - notification-service
      - lab-service
