<table>
  <thead>
    <tr>
      <th>Order #</th>
      <th>Tests</th>
      <th>Status</th>
      <th>Ordered</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (o of labService.orders(); track o.order_id) {
      <tr>
        <td>#{{ o.order_id }}</td>
        <td>{{ o.order_tests.length }} test(s)</td>
        <td><span class="status status-{{ o.status }}">{{ o.status }}</span></td>
        <td>{{ o.ordered_date | slice: 0:10 }}</td>
        <td><a [routerLink]="['/lab/orders', o.order_id]">View</a></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No lab orders found.</td>
      </tr>
    }
  </tbody>
</table>
